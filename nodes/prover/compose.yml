services:
  prover:
    image: lagunovsky/taiko-client:${CLIENT_TAG}
    restart: unless-stopped
    command: prover
    networks:
      - taiko
    env_file:
      - .env
    ports:
      - "${PROVER_PORT:-9876}:9876"
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "10"

networks:
  taiko:
    name: taiko
