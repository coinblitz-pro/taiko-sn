x-logging: &logging
  logging:
    driver: local
    options:
      max-size: 5m
      max-file: "10"

services:
  prover:
    image: lagunovsky/taiko-client:hekla-prover
    restart: unless-stopped
    depends_on:
      - raiko
    <<: *logging

  proposer:
    image: lagunovsky/taiko-client:hekla-proposer
    restart: unless-stopped
    environment:
      - PROVER_ENDPOINTS=http://prover:9876
      - PROPOSER_EPOCH_INTERVAL=2000ms
    depends_on:
      - prover
    <<: *logging
