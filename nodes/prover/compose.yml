services:
  prover:
    image: lagunovsky/taiko-client:${CLIENT_TAG}
    restart: unless-stopped
    command: prover
    networks:
      - taiko
    env_file:
      - .env
    environment:
      - KEYRING_SECRET_FILE=/run/secrets/keyring_secret
    secrets:
      - keyring_secret
    ports:
      - "${PROVER_PORT:-9876}:${PROVER_PORT:-9876}"
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "10"

networks:
  taiko:
    external: true

secrets:
  keyring_secret:
    environment: KEYRING_SECRET
