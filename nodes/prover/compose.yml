x-logging: &logging
  logging:
    driver: local
    options:
      max-size: 5m
      max-file: "10"

services:
  prover:
    image: lagunovsky/taiko-client:hekla-prover
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PROVER_PORT:-9876}:9876"
    <<: *logging

  proposer:
    image: lagunovsky/taiko-client:hekla-proposer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PROVER_ENDPOINTS=http://prover:9876
      - PROPOSER_EPOCH_INTERVAL=2000ms
      - EPOCH_GAP=1m
    depends_on:
      - prover
    <<: *logging
