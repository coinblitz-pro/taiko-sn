x-logging: &logging
  logging:
    options:
      max-size: 10m
      max-file: "3"

services:
  proposer:
    image: lagunovsky/taiko-client:hekla
    restart: unless-stopped
    command: proposer
    env_file:
      - .env
    networks:
      - taiko
    <<: *logging

  prover:
    image: lagunovsky/taiko-client:hekla
    restart: unless-stopped
    command: prover
    env_file:
      - .env
    networks:
      - taiko
    <<: *logging

networks:
  taiko:
    name: taiko
