x-logging:
  logging: &logging
    options:
      max-size: 10m
      max-file: "3"

logging:
  driver: local
  options:
    max-size: 5m
    max-file: "10"

services:
  proposer:
    image: lagunovsky/taiko-client:hekla
    restart: unless-stopped
    command: proposer
    env_file:
      - .env
    logging:
      <<: *logging

  prover:
    image: lagunovsky/taiko-client:hekla
    restart: unless-stopped
    command: prover
    env_file:
      - .env
    logging:
      <<: *logging
