services:
  proposer:
    image: lagunovsky/taiko-client:${CLIENT_TAG}
    restart: unless-stopped
    command: proposer
    networks:
      - taiko
    env_file:
      - .env
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "10"

networks:
  taiko:
    name: taiko
