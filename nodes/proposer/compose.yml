services:
  proposer:
    image: lagunovsky/taiko-client:${CLIENT_TAG}
    restart: unless-stopped
    command: proposer
    networks:
      - taiko
    env_file:
      - .env
    environment:
      - KEYRING_SECRET_FILE=/run/secrets/keyring_secret
    secrets:
      - keyring_secret
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "10"

secrets:
  keyring_secret:
    environment: KEYRING_SECRET

networks:
  taiko:
    external: true
