x-logging: &logging
  logging:
    options:
      max-size: 10m
      max-file: "3"

services:
  engine:
    image: us-docker.pkg.dev/evmchain/images/taiko-geth:${GETH_TAG}
    restart: unless-stopped
    pull_policy: always
    stop_grace_period: 3m
    env_file:
      - .env
    volumes:
      - ./data/taiko-geth:/data/taiko-geth
    ports:
      - "${PORT_L2_EXECUTION_ENGINE_AUTH}:8551"
      - "${PORT_L2_EXECUTION_ENGINE_HTTP}:8545"
      - "${PORT_L2_EXECUTION_ENGINE_WS}:8546"
      - "${PORT_L2_EXECUTION_ENGINE_P2P}:${PORT_L2_EXECUTION_ENGINE_P2P}"
      - "${PORT_L2_EXECUTION_ENGINE_P2P}:${PORT_L2_EXECUTION_ENGINE_P2P}/udp"
    command: |
      --taiko
      --networkid ${CHAIN_ID}
      --gcmode ${GCMODE:-archive}
      --syncmode ${SYNCMODE:-snap}
      --datadir /data/taiko-geth
      --bootnodes ${BOOT_NODES}
      --authrpc.port 8551
      --authrpc.addr "0.0.0.0"
      --authrpc.vhosts "*"
      --http
      --http.api debug,eth,net,web3,txpool,taiko
      --http.addr "0.0.0.0"
      --http.vhosts "*"
      --ws
      --ws.api debug,eth,net,web3,txpool,taiko
      --ws.addr "0.0.0.0"
      --ws.origins "*"
      --port ${PORT_L2_EXECUTION_ENGINE_P2P}
      --discovery.port ${PORT_L2_EXECUTION_ENGINE_P2P}
      --maxpeers ${MAXPEERS:-50}
      --maxpendpeers ${MAXPENDPEERS:-0}
      --metrics
      --metrics.expensive
      --metrics.addr "0.0.0.0"
      --gpo.defaultprice "10000000"
      ${GETH_ADDITIONAL_ARGS}
    networks:
      taiko: {}
      default:
        aliases:
          - l2_execution_engine
    <<: *logging
    profiles:
      - engine

  driver:
    image: lagunovsky/taiko-client:${CLIENT_TAG}
    restart: unless-stopped
    pull_policy: always
    command:
      - driver
    depends_on:
      - engine
    env_file:
      - .env
    environment:
      - L2_ENDPOINT_WS=ws://engine:8546
      - L2_ENDPOINT_AUTH=http://engine:8551
      - ACCESS_KEY=${CLIENT_ACCESS_KEY}
    volumes:
      - ./data/taiko-geth:/data/taiko-geth
      - ./src/simple-taiko-node/script:/script
    <<: *logging
    profiles:
      - engine

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    depends_on:
      - engine
      - driver
    volumes:
      - ./../../upstream/simple-taiko-node/docker/prometheus/l2:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - --log.level=debug
      - --config.file=/etc/prometheus/prometheus.yml
    profiles:
      - grafana
    <<: *logging

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - ${PORT_GRAFANA}:3000
    depends_on:
      - engine
      - driver
      - prometheus
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/custom/settings.ini
      - GF_PATHS_PROVISIONING=/etc/grafana/custom/provisioning
      - GF_LOG_LEVEL=WARN
    volumes:
      - ./../../upstream/simple-taiko-node/docker/grafana/custom/settings.ini:/etc/grafana/custom/settings.ini
      - ./../../upstream/simple-taiko-node/docker/grafana/custom/l2/provisioning/:/etc/grafana/custom/provisioning/
      - grafana_data:/var/lib/grafana
    profiles:
      - grafana
    <<: *logging

volumes:
  prometheus_data: {}
  grafana_data: {}

networks:
  taiko:
    name: taiko
